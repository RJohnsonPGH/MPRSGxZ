name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ format('ghcr.io/{0}/{1}', github.repository_owner, github.event.repository.name) | lower }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MPRSGxZ.slnx

      - name: Build
        run: dotnet build MPRSGxZ.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MPRSGxZ.slnx -c Release --no-build --report-trx --report-trx-filename test-results.trx

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          reporter: dotnet-trx
          path: '**/TestResults/*.trx'
          fail-on-alert: true
          output-format: github-check-run

      - name: Publish
        run: |
          dotnet publish src/MPRSGxZ.Web/MPRSGxZ.Web.csproj -c Release --no-build -o artifacts/mprsgxz-web
          dotnet publish src/MPRSGxZ.CLI/MPRSGxZ.CLI.csproj -c Release --no-build -o artifacts/mprsgxz-cli

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MPRSGxZ.Web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
