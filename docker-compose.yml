services:
  web:
    # Images are published to GHCR by the release workflow (triggered by pushing a v* tag).
    # Use "latest" for the newest release, or pin to a tag/sha image for reproducibility.
    # To build locally instead, replace "image" with:
    #   build:
    #     context: .
    #     dockerfile: src/MPRSGxZ.Web/Dockerfile
    image: ghcr.io/rjohnsonpgh/mprsgxz:latest
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # - AMP_TRUST_PROXY_HEADERS=false  # uncomment if exposing this port directly without a reverse proxy in front of it
    volumes:
      - amp-data:/data
      - amp-logs:/logs
    restart: unless-stopped

volumes:
  amp-data:
  amp-logs:
