name: PR Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MPRSGxZ.slnx

      - name: Build
        run: dotnet build MPRSGxZ.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MPRSGxZ.slnx -c Release --no-build --report-trx --report-trx-filename test-results.trx

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          reporter: dotnet-trx
          path: '**/TestResults/*.trx'
          fail-on-alert: true
          output-format: github-check-run
